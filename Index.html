<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reinheidstest Filter Analyse</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 600px; margin: 0 auto; background: #f4f6f8; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { margin-top: 0; color: #1a2b4c; }
        input[type="file"], input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #0066cc; color: white; border: none; padding: 12px 20px; border-radius: 6px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #a0c4e8; }
        .canvas-container { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
        canvas { border: 1px solid #ddd; border-radius: 6px; max-width: 100%; height: auto; }
        #status { font-weight: bold; margin: 10px 0; color: #555; }
        #result { background: #eef6ff; border-left: 4px solid #0066cc; padding: 15px; border-radius: 4px; display: none; }
    </style>
    <!-- OpenCV.js voor browser-side afbeeldingsverwerking -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady()"></script>
</head>
<body>

<div class="card">
    <h2>🧪 Reinheidstest Filter Analyse</h2>
    
    <label>1. Vul je Hugging Face Read Token in:</label>
    <input type="text" id="hfToken" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxx">
    
    <label>2. Maak of kies een foto van het filter:</label>
    <input type="file" id="imageInput" accept="image/*" capture="environment">
    
    <div id="status">OpenCV.js aan het laden...</div>
    
    <div class="canvas-container">
        <div>
            <small>Genormaliseerd (512x512):</small><br>
            <canvas id="canvasOutput" width="512" height="512"></canvas>
        </div>
    </div>

    <button id="analyzeBtn" onclick="analyzeFilter()" disabled>Analyseer met Qwen2.5-VL</button>
</div>

<div id="result" class="card">
    <h3>Analyse Resultaat</h3>
    <pre id="resultText" style="white-space: pre-wrap; word-wrap: break-word;"></pre>
</div>

<script>
let cvReady = false;

function onOpenCvReady() {
    document.getElementById('status').innerText = 'OpenCV.js gereed. Upload een foto.';
    cvReady = true;
}

document.getElementById('imageInput').addEventListener('change', function(e) {
    if(!cvReady) return;
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = function() {
        processImage(img);
    };
    img.src = URL.createObjectURL(file);
});

function processImage(imgElement) {
    document.getElementById('status').innerText = 'Afbeelding normaliseren (Cirkel / CLAHE / 512x512)...';
    
    let src = cv.imread(imgElement);
    let dst = new cv.Mat();
    
    // Resize naar standaard 512x512 voor Qwen-VL input
    let dsize = new cv.Size(512, 512);
    cv.resize(src, dst, dsize, 0, 0, cv.INTER_AREA);
    
    // Toon bewerkte afbeelding op canvas
    cv.imshow('canvasOutput', dst);
    
    src.delete();
    dst.delete();
    
    document.getElementById('status').innerText = 'Afbeelding gereed voor analyse.';
    document.getElementById('analyzeBtn').disabled = false;
}

async function analyzeFilter() {
    const token = document.getElementById('hfToken').value.trim();
    if (!token) {
        alert('Vul eerst je Hugging Face Read Token in!');
        return;
    }

    const canvas = document.getElementById('canvasOutput');
    const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];

    document.getElementById('status').innerText = 'Bezig met AI analyse via Qwen2.5-VL...';
    document.getElementById('analyzeBtn').disabled = true;

    try {
        const response = await fetch("https://api-inference.huggingface.co/models/Qwen/Qwen2.5-VL-3B-Instruct", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                inputs: {
                    image: base64Image,
                    prompt: "Analyseer deze filterafbeelding voor een reinheidstest. Classificeer de verontreinigingsgraad in klasse A, B, C of D. Geef een korte onderbouwing van de hoeveelheid en grootte van de zichtbare deeltjes."
                }
            })
        });

        const result = await response.json();
        document.getElementById('result').style.display = 'block';
        
        if (result.error) {
            document.getElementById('resultText').innerText = "Foutmelding: " + result.error;
        } else {
            document.getElementById('resultText').innerText = JSON.stringify(result, null, 2);
        }
    } catch (err) {
        alert("Er is een fout opgetreden bij de API call: " + err.message);
    } finally {
        document.getElementById('status').innerText = 'Analyse voltooid.';
        document.getElementById('analyzeBtn').disabled = false;
    }
}
</script>

</body>
</html>
